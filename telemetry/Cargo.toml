[package]
name = "telemetry"
version = "0.1.0"
edition = "2024"
description = "Prometheus metrics for zkrp services. Counts only: no label ever holds a peer, address, or user."

[dependencies]
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
tower = "0.5"
http = "1"
tracing = "0.1"
