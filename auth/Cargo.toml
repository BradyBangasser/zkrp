[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14.6"
prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
zeroize = "1"
dotenv = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Nullifier set. sqlx over a persistent-volume Postgres.
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
] }

# The pepper never leaves KMS: nullifier = KMS.GenerateMac(key, email).
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-kms = "1"
aws-sdk-sesv2 = "1"

# Local MAC keys (nullifier fallback) + SHA-256.
ring = "0.17"
chacha20poly1305 = "0.10"
getrandom = "0.3"

# App Attest: CBOR attestation object, X.509 chain (P-384 / P-256 ECDSA).
ciborium = "0.2"
x509-parser = { version = "0.18", features = ["verify"] }

# Anonymous credential issuance.
zkcred = { path = "../zkcred" }
telemetry = { path = "../telemetry" }

[build-dependencies]
protoc-bin-vendored = "3.3"
tonic-prost-build = "0.14"
