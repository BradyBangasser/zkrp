[package]
name = "libghost"
description = "The zkrp client library: encrypted libp2p mesh, admission, enrollment, discovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libp2p = { workspace = true, features = [
  "macros",
  "tokio",
  "tcp",
  "quic",
  "noise",
  "yamux",
  "kad",
  "relay",
  "dns",
  "mdns",
  "dcutr",
  "autonat",
  "identify",
  "gossipsub",
  "request-response",
] }
libp2p-core = "0.43"
zkcred.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["time"] }
futures.workspace = true
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost.workspace = true
prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
postcard = { version = "1", features = ["alloc"] }
async-trait.workspace = true
thiserror.workspace = true
hex.workspace = true
base64.workspace = true
rusqlite = { version = "0.39", features = ["bundled"] }
ulid = "1"
rand = "0.9"

# Crypto
ring.workspace = true
zeroize = { workspace = true, features = ["std", "derive"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = { version = "5.0.0-rc.1", features = ["rand_core"] }
chacha20poly1305.workspace = true
aes-gcm = "0.10.3"
hmac = "0.13.0"
sha2 = "0.11"
sha3 = "0.12"

[build-dependencies]
protoc-bin-vendored.workspace = true
prost-build = "0.14"
tonic-prost-build.workspace = true
