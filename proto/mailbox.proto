syntax = "proto3";
package zrp.mailbox.v1;

import "google/protobuf/empty.proto";

// Mailboxes let the relay wake an offline device without knowing who it is.
//
// A mailbox_id is a rotating, opaque CAPABILITY -- shared only with the people
// who should be able to reach you (over the already-encrypted channel), never
// derived from a name, peer id, or credential. Knowing the id is what grants
// the ability to subscribe to it; treat it like a secret.
//
// Push: a device registers a *sealed* push token under each mailbox it
// watches (Register). The token is sealed to the push service's public key
// (zkcred::sealed_box, NetworkConfig.push_public_key) with a fresh ephemeral
// key every time, so the relay stores boxes it can't open and can't link to
// each other or across mailboxes. When a message is deposited, the relay hands
// the mailbox's boxes to the push service, which opens them and sends a
// content-free alert; it never learns the mailbox id.
//
// There is deliberately no public Notify RPC: only a deposit triggers a push,
// so nothing here lets an attacker spam a device or probe whether a mailbox
// is live without also depositing into it.

// --- store-and-forward -------------------------------------------------------
//
// Because gossipsub is ephemeral and push is deferred, an offline recipient's
// like/DM/party message is stored as an opaque, end-to-end-encrypted blob under
// the (rotating, capability) mailbox id, in S3, and fetched on reconnect. The
// relay cannot read the ciphertext; it only routes by mailbox id. Knowing the
// id is the capability to deposit to and fetch from it. Objects age out via an
// S3 lifecycle rule on the `mb/` prefix, so nothing lingers.

message DepositRequest {
  string mailbox_id = 1;
  bytes  ciphertext = 2;  // opaque; encrypted client-side to the pair/party
  // The sender's own registration tag for this mailbox (see RegisterRequest),
  // so its own device isn't woken for its own message. Empty: wake everyone.
  bytes  sender_tag = 3;
}
message DepositResponse {
  string msg_id     = 1;  // lexicographically sortable = chronological
}

message FetchRequest {
  string mailbox_id = 1;
  // Cursor: last msg_id you already have. Empty = from the beginning of what's
  // retained. The recipient tracks this per mailbox; there is no server-side
  // delete, so one party can't drop another's undelivered mail.
  string after      = 2;
  uint32 limit      = 3;  // 0 = server default
}
message Envelope {
  string msg_id     = 1;
  bytes  ciphertext = 2;
  uint64 stored_at  = 3;  // unix millis, advisory
}
message FetchResponse {
  repeated Envelope envelopes = 1;
  bool has_more               = 2;
}

// --- push registration ------------------------------------------------------

message RegisterRequest {
  string mailbox_id   = 1;
  // An id for this device in this mailbox only (16-32 bytes): a keyed hash
  // of the mailbox id, so it differs per mailbox. Re-registering with the
  // same tag replaces the earlier box.
  bytes  tag          = 2;
  // zkcred::sealed_box of the device's push token, to the push service.
  bytes  sealed_token = 3;
}

service MailboxService {
  rpc Deposit(DepositRequest)   returns (DepositResponse);
  rpc Fetch(FetchRequest)       returns (FetchResponse);
  // Registrations expire with the mailbox (an S3 lifecycle rule on push/).
  rpc Register(RegisterRequest) returns (google.protobuf.Empty);
}
